services:
  # 考勤系统应用
  app:
    build: .
    container_name: attendance-app
    restart: unless-stopped
    ports:
      - "9010:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MYSQL_HOST=host.docker.internal
      - MYSQL_PORT=3307
      - MYSQL_USER=root
      - MYSQL_PASSWORD=123456
      - MYSQL_DATABASE=${MYSQL_DATABASE:-attendance_system}
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
    volumes:
      - ./uploads:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"

# 使用本机MySQL，无需额外配置
