version: '3.8'

services:
  # MySQL数据库服务
  mysql:
    image: mysql:8.0
    container_name: attendance-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: attendance_system
      MYSQL_USER: attendance_user
      MYSQL_PASSWORD: attendance_pass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./attendance_system.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - attendance-network

  # Node.js应用服务
  app:
    build: .
    container_name: attendance-app
    restart: unless-stopped
    ports:
      - "9010:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=mysql
      - DB_USER=attendance_user
      - DB_PASSWORD=attendance_pass
      - DB_NAME=attendance_system
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
    depends_on:
      - mysql
    volumes:
      - ./uploads:/app/uploads
    networks:
      - attendance-network

volumes:
  mysql_data:

networks:
  attendance-network:
    driver: bridge
